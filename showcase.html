<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encore | 매장 운영 데모</title>
<style>
:root{font-family:Arial,"Malgun Gothic",sans-serif;color:#263149;background:#f7f8fc}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #d54e83;outline-offset:2px}
.shell{display:grid;grid-template-columns:204px minmax(0,1fr);min-height:710px}.sidebar{background:white;border-right:1px solid #e9eaf1;padding:24px 12px}.brand{font-size:25px;font-weight:850;color:#ed6597;margin:0 12px 5px}.brand small{font-size:10px;display:block;color:#9095a4;margin-top:4px}.store{margin:22px 9px;padding:12px;border-radius:12px;background:#fff1f6;font-size:12px;font-weight:800}.nav{display:flex;flex-direction:column;gap:4px}.nav button{width:100%;border:0;background:transparent;text-align:left;border-radius:11px;padding:12px 13px;color:#455069;font-weight:700;font-size:13px}.nav button.active,.nav button:hover{background:#fff0f6;color:#c53370}
.main{padding:25px 28px;min-width:0}.top{display:flex;gap:12px;justify-content:space-between;align-items:center}.top h1{font-size:23px;margin:0}.pill{background:#fff0f6;border-radius:99px;padding:8px 12px;color:#b63c73;font-size:11px;font-weight:800}.muted{color:#808a9c;font-size:12px;line-height:1.65}.notice{margin:20px 0;background:#fff7e7;color:#94611c;padding:12px 15px;border-radius:12px;font-size:12px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:white;border:1px solid #edeef3;border-radius:17px;padding:19px;box-shadow:0 3px 12px #25304b06}.card b{display:block;font-size:26px;margin-top:10px}.card span{font-size:12px;color:#68748a}.panel{margin-top:15px}.panel h2{font-size:16px;margin:0 0 13px}.action{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #f1f2f7;padding:13px 0;font-size:13px}.action:last-child{border:0}.action em{color:#7c8799;font-size:11px;font-style:normal;display:block;margin-top:4px}.tag{background:#f0f5ff;color:#4674bc;padding:6px 10px;border-radius:20px;font-size:11px;white-space:nowrap}.button{background:#ee6898;color:white;border:0;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700}.button:disabled{opacity:.5;cursor:not-allowed}.table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}.table td,.table th{border-bottom:1px solid #eef0f4;padding:12px 6px}.table th{color:#818b9b;font-weight:700}.empty{padding:14px;color:#8290a0;font-size:12px}.hint{background:#f6f8ff;border-radius:12px;padding:15px;margin-top:14px;font-size:12px;color:#586780;line-height:1.7}
@media(max-width:850px){.shell{grid-template-columns:160px minmax(0,1fr)}.main{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.sidebar{padding:17px 6px}}@media(max-width:530px){.shell{grid-template-columns:1fr}.sidebar{padding:12px;border-right:0;border-bottom:1px solid #eee}.brand,.store{display:none}.nav{flex-direction:row;overflow-x:auto;white-space:nowrap}.nav button{width:auto;flex:none;padding:9px}.main{padding:14px}.top h1{font-size:19px}.card{padding:13px}.card b{font-size:21px}.action{align-items:start}}
</style></head>
<body>
<div class="shell"><aside class="sidebar"><div class="brand">♥ Encore<small>사장님의 AI 매장 운영 비서</small></div><div class="store">🏪 T-Mart · 데모 매장</div><nav class="nav" id="nav" aria-label="운영 메뉴"></nav></aside>
<main class="main"><header class="top"><h1 id="heading">오늘의 제안</h1><span class="pill">🔒 읽기 전용 데모</span></header><p class="muted" id="intro">아라가 오늘 챙길 일을 먼저 알려드립니다.</p><div class="notice">체험용 가상 데이터입니다. 실제 예약·문자·리뷰·고객 정보와 연결되지 않습니다.</div><section id="content" aria-live="polite"></section></main></div>
<script>
"use strict";
const menu=[["today","✨ 오늘의 제안"],["booking","📅 예약 관리"],["customers","👥 고객 관리"],["sms","💬 문자 마케팅"],["events","🎉 이벤트"],["reviews","⭐ Google 리뷰"],["facebook","📷 Facebook 홍보"],["schedule","🗓️ 사장님 일정"],["sales","📊 매출 대시보드"]];
const titles={today:"오늘의 제안",booking:"예약 관리",customers:"고객 관리",sms:"문자 마케팅",events:"이벤트 마케팅",reviews:"Google 리뷰",facebook:"Facebook 사진 홍보",schedule:"사장님 일정",sales:"매출 대시보드"};
const subt={today:"사장님, 오늘은 이것만 챙기세요.",booking:"시간별 예약 현황을 확인합니다.",customers:"고객의 방문과 재방문 시기를 살펴봅니다.",sms:"아라가 문자 초안을 준비합니다.",events:"다가오는 매장 이벤트를 준비합니다.",reviews:"리뷰를 확인하고 답글을 준비합니다.",facebook:"매장 홍보 문구를 준비합니다.",schedule:"오늘의 업무를 한눈에 확인합니다.",sales:"매장 운영 숫자를 살펴봅니다."};
const rows=(head,items)=>'<table class="table"><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+items.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
const box=(title,inner)=>'<div class="panel"><h2>'+title+'</h2>'+inner+'</div>';
const item=(name,detail,status)=>'<div class="action"><div><strong>'+name+'</strong><em>'+detail+'</em></div><span class="tag">'+status+'</span></div>';
const pages={
today:()=>'<div class="cards">'+[['오늘 예약','8건'],['재방문 추천','14명'],['리뷰 요청','5명'],['준비할 이벤트','2건']].map(([a,b])=>'<div class="card"><span>'+a+'</span><b>'+b+'</b></div>').join('')+'</div>'+box('🤖 아라의 오늘 제안',item('재방문 예정 고객에게 안부 문자','최근 방문 주기를 기준으로 14명 선정','문자 초안')+item('오늘 예약 8건 확인','고객 방문 시간과 예약 상태 점검','예약 확인')+item('다가오는 이벤트 준비','고객 대상 이벤트 메시지 미리 준비','이벤트')+item('리뷰를 남긴 고객에게 답글','답글 초안을 검토한 뒤 게시','리뷰 답글')) ,
booking:()=>box('오늘 예약 · 예시',rows(['시간','고객','서비스','상태'],[['10:00','김○○','예약 서비스','확정'],['11:30','이○○','예약 서비스','온라인 요청'],['13:00','박○○','예약 서비스','확정'],['15:30','최○○','예약 서비스','확정']]))+ '<div class="hint">실제 운영 화면에서는 15/30/60분 단위 예약 히트맵과 승인 기능을 사용할 수 있습니다. 이 화면에서는 예약이 변경되지 않습니다.</div>',
customers:()=>'<div class="cards">'+[['전체 고객','128명'],['문자 동의','96명'],['최근 30일 방문','42명'],['30일 이상 미방문','31명']].map(([a,b])=>'<div class="card"><span>'+a+'</span><b>'+b+'</b></div>').join('')+'</div>'+box('재방문 추천 고객',rows(['고객','최근 방문','추천','상태'],[['김○○','6주 전','재방문 안내','문자 동의'],['이○○','8주 전','방문 확인','문자 동의'],['박○○','5주 전','예약 안내','문자 동의']])) ,
sms:()=>box('아라의 문자 초안',item('재방문 안내','안녕하세요! 방문해 주셔서 감사합니다. 재방문 시기가 되어 안내드립니다.','초안 14건')+item('이벤트 안내','다가오는 이벤트 혜택을 확인해 보세요.','초안 9건'))+'<div class="hint">실제 발송은 사장님 승인 및 고객 수신 동의 확인 후 진행됩니다. 데모에는 발송 기능이 없습니다.</div>',
events:()=>box('다가오는 이벤트',item('T-Mart Anniversary','11월 15일 · 21일 전 준비 시작','계획')+item('Thanksgiving','11월 넷째 목요일','준비 예정')+item('Christmas','12월 25일','준비 예정')) ,
reviews:()=>box('Google 리뷰 · 예시',item('★★★★★ · 방문 고객','친절하고 편하게 이용했습니다.','답글 준비')+item('아라의 답글 제안','소중한 리뷰 감사합니다! 다음 방문도 정성껏 모시겠습니다.','검토 필요'))+'<div class="hint">현재 Basic 방식은 답글을 복사해 Google에 직접 게시합니다. 이 데모에서는 게시하지 않습니다.</div>',
facebook:()=>box('사진 홍보 미리보기',item('이번 주 매장 소식','방문해 주신 고객 여러분께 감사드립니다!','영어 초안')+item('한국어 설명','이번 주 소식을 고객과 나누는 홍보 게시글입니다.','승인 전'))+'<div class="hint">실제 Facebook 계정에 게시하거나 이미지를 업로드하지 않습니다.</div>',
schedule:()=>box('사장님 일정 · 예시',item('09:30 · 오픈 준비','당일 예약과 준비 사항 확인','예정')+item('12:00 · 예약 확인','오후 방문 예약 점검','예정')+item('17:00 · 하루 마감','매출 및 리뷰 확인','예정')),
sales:()=>'<div class="cards">'+[['오늘 매출','$1,240'],['이번 주 매출','$6,870'],['오늘 방문','18명'],['예약 전환','8건']].map(([a,b])=>'<div class="card"><span>'+a+'</span><b>'+b+'</b></div>').join('')+'</div>'+box('운영 브리핑',item('방문 고객 요약','반복 방문 고객 비중과 다음 연락 대상을 살펴보세요.','예시 지표')+item('내일 준비','예약과 문자 동의 현황을 확인합니다.','AI 제안'))};
function show(key){if(!Object.prototype.hasOwnProperty.call(pages,key))key="today";document.getElementById("heading").textContent=titles[key];document.getElementById("intro").textContent=subt[key];document.getElementById("content").innerHTML=pages[key]();document.querySelectorAll("[data-tab]").forEach(b=>{const active=b.dataset.tab===key;b.classList.toggle("active",active);b.setAttribute("aria-current",active?"page":"false")});}
const nav=document.getElementById("nav");menu.forEach(([k,label])=>{const b=document.createElement("button");b.type="button";b.dataset.tab=k;b.textContent=label;b.addEventListener("click",()=>show(k));nav.appendChild(b)});show("today");
</script></body></html>
