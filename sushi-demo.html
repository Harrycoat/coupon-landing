<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encore Sushi · 점주 기능 체험</title><style>
*{box-sizing:border-box}body{margin:0;background:#09182b;color:#edf5ff;font:15px/1.6 system-ui,sans-serif}a{color:inherit}button,input,select,textarea{font:inherit}button,a.cta{cursor:pointer;border:1px solid #496383;background:#203e60;color:white;border-radius:10px;padding:10px 15px;text-decoration:none}button:hover,a.cta:hover{filter:brightness(1.15)}button:focus-visible,a:focus-visible{outline:3px solid #ffc629;outline-offset:3px}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100dvh}aside{background:#102744;padding:26px 18px;border-right:1px solid #304c6e}aside strong{font-size:25px}.store{color:#ffc629;margin:15px 0 22px}nav{display:grid;gap:9px}nav a{text-decoration:none;padding:12px;border-radius:10px;color:#c4d5eb}nav a[aria-current=page]{background:#ffc629;color:#14263e;font-weight:800}.robot{display:block;width:120px;height:175px;object-fit:contain;margin:25px auto}main{min-width:0;padding:30px;max-width:1250px;width:100%}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:27px}h2{font-size:19px;margin:0 0 16px}.notice{background:#253855;border:1px solid #5c6681;border-radius:12px;padding:13px 17px;color:#ffdf9a;margin:20px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.panel{background:#142e4d;border:1px solid #365778;border-radius:17px;padding:22px}.card strong{display:block;font-size:30px;color:#ffc629}.panel{margin-top:18px}.muted{color:#b3c4d9;font-size:13px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:12px}.primary{background:#ffc629;color:#132844;font-weight:800;border-color:#ffc629}input,select,textarea{background:#f4f7fb;color:#172c45;border:0;border-radius:9px;padding:11px;max-width:100%}label{display:grid;gap:6px}textarea{width:100%;min-height:110px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #365778;padding:13px 9px}th{color:#abc4e2}.scroll{overflow:auto}.badge{background:#284b70;border-radius:20px;padding:4px 10px;white-space:nowrap}.feedback{color:#b8f6d9;min-height:26px;margin-top:15px}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}.hero{padding:18px;background:linear-gradient(120deg,#203b61,#59405b);border-radius:12px}.hero b{font-size:22px}footer{margin-top:30px;color:#a4b9d1;font-size:12px}@media(max-width:760px){.shell{grid-template-columns:1fr}aside{padding:14px}.store{margin:4px 0 12px}nav{display:flex;overflow:auto;white-space:nowrap}nav a{flex:none}.robot{display:none}main{padding:18px}.cards{gap:8px}.card{padding:14px}.card strong{font-size:23px}h1{font-size:23px}.panel{padding:16px}td,th{padding:11px 7px}}
</style></head><body><div class="shell"><aside><strong>♥ Encore</strong><div class="store">🍣 Encore Sushi<br><small>점주 기능 공개 체험</small></div><nav aria-label="체험 메뉴" id="nav"></nav><img class="robot" src="/ara-robot.svg" alt="AI 비서 아라"><a href="/">← 홈페이지</a></aside><main><header><h1 id="title"></h1><a class="cta primary" href="https://demo.encoremarketingsystem.com/apply">내 매장 신청하기 →</a></header><div class="notice">체험용 샘플 데이터입니다. 입력 내용은 현재 화면에서만 사용하며 새로고침하면 초기화됩니다. 실제 예약·고객 저장·문자 발송은 실행되지 않습니다.</div><section id="content"></section><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="toolbar"><a class="cta" href="https://demo.encoremarketingsystem.com/guest-ara/visit/98Hvn_OXXJXt0Wi4kaTAWwjW4pKr8-dT" target="_blank" rel="noopener">고객용 Sushi 아라 열기 ↗</a><button id="reset">샘플 초기화</button></div><p class="muted">고객용 아라는 실제 별도 서비스로 열립니다. 전화번호 인증 등 실제 동작이 포함될 수 있습니다.</p><footer>Powered by Encore · ARA AI</footer></main></div><script>
'use strict';
const menus=[['booking','📅 예약 비서'],['customers','👥 고객 비서'],['events','🎁 이벤트 마케팅'],['sms','💬 문자 마케팅'],['reviews','⭐ 리뷰 관리'],['sales','📊 매출·운영 브리핑']];
const $=id=>document.getElementById(id);const initial=()=>({bookings:[{time:'12:00',name:'샘플 손님 A',people:2,status:'확정'},{time:'18:30',name:'샘플 손님 B',people:4,status:'대기'}],customers:[{name:'샘플 손님 A',visits:3,points:3,day:false},{name:'샘플 손님 B',visits:9,points:9,day:false}],coupons:[],used:[],sales:[],event:null});let state=initial(),active='';
function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n}function say(t){$('feedback').textContent=t}function panel(title,html){return '<div class="panel"><h2>'+title+'</h2>'+html+'</div>'}function stats(items){return '<div class="cards">'+items.map(([a,b])=>'<div class="card">'+a+'<strong>'+b+'</strong></div>').join('')}
function show(){active=location.hash.slice(1);if(!menus.some(m=>m[0]===active))active='booking';$('title').textContent=menus.find(m=>m[0]===active)[1];document.querySelectorAll('nav a').forEach(a=>a.setAttribute('aria-current',a.hash==='#'+active?'page':'false'));say('');const c=$('content');
if(active==='booking'){c.innerHTML=stats([['샘플 예약',state.bookings.length+'건'],['확정',state.bookings.filter(x=>x.status==='확정').length+'건'],['안내 문자','발송 안 함']])+panel('예약 현황','<div class="scroll"><table><thead><tr><th>시간</th><th>손님</th><th>인원</th><th>상태</th><th>처리</th></tr></thead><tbody id="bookingRows"></tbody></table></div>')+panel('예약 추가 체험','<form id="book" class="row"><label>시간<input name="time" type="time" required value="19:00"></label><label>샘플 이름<input name="name" maxlength="30" required placeholder="실제 개인정보 입력 금지"></label><label>인원<input name="people" type="number" min="1" max="20" value="2" required></label><button class="primary">샘플 예약 추가</button></form>');state.bookings.forEach((r,i)=>{const tr=document.createElement('tr');[r.time,r.name,r.people+'명',r.status].forEach(t=>tr.append(node('td',t)));const td=document.createElement('td'),b=node('button',r.status==='확정'?'취소 체험':'확정 체험');b.onclick=()=>{state.bookings[i].status=r.status==='확정'?'취소':'확정';show();say('샘플 예약 상태를 변경했어요. 실제 예약에는 영향이 없어요.')};td.append(b);tr.append(td);$('bookingRows').append(tr)});$('book').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.bookings.push({time:f.get('time'),name:f.get('name'),people:Number(f.get('people')),status:'대기'});show();say('현재 화면에 샘플 예약을 추가했어요.')};}
if(active==='customers'){c.innerHTML=stats([['샘플 손님','2명'],['방문 포인트','하루 1회'],['보너스 예시','10회']])+panel('방문 스탬프·보너스 체험','<p class="muted">예시 조건: 방문 1회당 1점, 10회 방문 시 10% 쿠폰. 실제 매장 설정과 별개입니다.</p><div class="scroll"><table><thead><tr><th>고객</th><th>방문</th><th>누적 포인트</th><th>오늘 적립</th></tr></thead><tbody id="customerRows"></tbody></table></div>')+panel('쿠폰번호 · 상태 · 쿠폰처리','<div id="coupons" class="stack"></div>');state.customers.forEach((r,i)=>{let tr=document.createElement('tr');[r.name,r.visits+'회',r.points+'점'].forEach(t=>tr.append(node('td',t)));let td=document.createElement('td'),b=node('button',r.day?'오늘 적립 완료':'포인트 적립 체험');b.disabled=r.day;b.onclick=()=>{r.day=true;r.visits++;r.points++;if(r.visits===10)state.coupons.push('DEMO-SUSHI-001');show();say('샘플 1점을 적립했어요. 인증 문자는 발송하지 않아요.')};td.append(b);tr.append(td);$('customerRows').append(tr)});if(!state.coupons.length)$('coupons').textContent='샘플 손님 B에게 1점을 적립하면 보너스 쿠폰이 표시됩니다.';state.coupons.forEach(code=>{let row=document.createElement('div');row.className='row';row.append(node('span',code+' · 10% 할인 · '+(state.used.includes(code)?'사용 완료':'사용 가능')));let b=node('button','사용 확인 체험');b.disabled=state.used.includes(code);b.onclick=()=>{state.used.push(code);show();say('샘플 쿠폰을 사용 완료로 변경했어요.')};row.append(b);$('coupons').append(row)});}
if(active==='events'){c.innerHTML=panel('고객 핸드폰에 표시할 내용 체험','<form id="event" class="stack"><label>🍽️ Today’s picks · 오늘의 추천<input name="pick" maxlength="150" value="연어·참치 니기리 세트"></label><label>🎁 Today’s offers · 오늘의 혜택<input name="offer" maxlength="150" value="샘플 혜택: 세트 주문 시 음료 1잔"></label><button class="primary">샘플 미리보기</button></form>')+panel('고객 화면 미리보기','<div id="eventPreview" class="hero"></div><p class="muted">이 내용은 체험 예시이며 고객용 실제 채팅에는 저장되지 않습니다.</p>');function preview(p,o){$('eventPreview').replaceChildren(node('b','🍣 Encore Sushi'),node('p','오늘의 추천: '+p),node('p','오늘의 혜택: '+o))}preview(...(state.event||['연어·참치 니기리 세트','샘플 혜택: 세트 주문 시 음료 1잔']));$('event').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.event=[f.get('pick'),f.get('offer')];preview(...state.event);say('샘플 고객 화면에 표시했어요. 실제 행사는 변경되지 않아요.')};}
if(active==='sms'){c.innerHTML=panel('동의 고객 대상 문자 준비 체험','<p>대상: 문자 수신에 동의한 샘플 고객 2명</p><label>문자 내용<textarea id="smsText">[Encore Sushi 샘플] 이번 주 추천 메뉴를 만나보세요! Reply STOP to unsubscribe.</textarea></label><p class="muted">전화번호 입력과 실제 문자 발송은 제공하지 않습니다.</p><button id="smsPreview" class="primary">문자 미리보기</button><div id="smsOutput" class="hero" hidden></div>');$('smsPreview').onclick=()=>{$('smsOutput').hidden=false;$('smsOutput').textContent=$('smsText').value;say('미리보기 완료 · 실제 발송 0건')};}
if(active==='reviews'){c.innerHTML=panel('리뷰 요청 문구 체험','<p>방문 후 손님에게 전달할 요청 문구를 준비합니다.</p><textarea id="reviewRequest">Encore Sushi에 방문해 주셔서 감사합니다. 즐거운 식사 되셨나요? 방문 경험을 Google 리뷰로 남겨주시면 도움이 됩니다.</textarea><button id="reviewCopy">문구 복사</button>')+panel('리뷰 답글 초안 예시','<p class="muted">샘플 리뷰: “음식이 맛있고 직원이 친절했어요.”</p><textarea>방문해 주셔서 감사합니다! 음식과 서비스에 만족하셨다니 기쁩니다. 다음에도 정성껏 맞이하겠습니다. — Encore Sushi</textarea><p class="muted">체험용으로 작성된 예시이며 Google 게시나 문자 전송은 실행하지 않습니다.</p>');$('reviewCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('reviewRequest').value);say('리뷰 요청 문구를 복사했어요.')}catch{say('복사가 제한되어 있어요. 문구를 직접 선택해 복사해 주세요.')}};}
if(active==='sales'){let rev=state.sales.reduce((s,r)=>s+r.rev,1250),exp=state.sales.reduce((s,r)=>s+r.exp,420);c.innerHTML=stats([['샘플 매출','$'+rev.toFixed(2)],['샘플 지출','$'+exp.toFixed(2)],['매출 − 지출','$'+(rev-exp).toFixed(2)]])+panel('오늘 운영 브리핑 예시','<div class="stack"><span>📅 샘플 예약 '+state.bookings.filter(x=>x.status!=='취소').length+'건을 확인하세요.</span><span>⭐ 방문 후 리뷰 요청 문구를 준비하세요.</span><span>🎁 오늘의 추천과 혜택을 확인하세요.</span></div>')+panel('매출·지출 입력 체험','<form id="sales" class="row"><label>날짜<input name="date" type="date" required></label><label>매출 ($)<input name="rev" type="number" min="0" max="999999" step="0.01" required></label><label>지출 ($)<input name="exp" type="number" min="0" max="999999" step="0.01" value="0" required></label><button class="primary">샘플 기록 추가</button></form><div id="salesRows" class="stack"></div>');$('sales').elements.date.value=new Date().toLocaleDateString('en-CA');state.sales.forEach(r=>$('salesRows').append(node('p',r.date+' · 매출 $'+r.rev.toFixed(2)+' · 지출 $'+r.exp.toFixed(2))));$('sales').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.sales.push({date:f.get('date'),rev:Number(f.get('rev')),exp:Number(f.get('exp'))});show();say('샘플 합계에 반영했어요. 실제 매출 기록은 변경되지 않아요.')};}
}
menus.forEach(([key,title])=>{let a=node('a',title);a.href='#'+key;$('nav').append(a)});$('reset').onclick=()=>{state=initial();show();say('샘플 데이터를 초기화했어요.')};window.addEventListener('hashchange',show);show();
</script></body></html>
