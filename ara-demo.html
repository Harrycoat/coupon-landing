<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1c34">
<title>Encore 데모 아라</title>
<style>
:root{--bg:#071528;--panel:#102744;--line:#294a74;--txt:#eef6ff;--muted:#9db5d2;--yellow:#ffc126;--blue:#245fbe}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--txt)}
body{display:flex;justify-content:center}.app{width:100%;max-width:520px;min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#102846,#09182b)}
header{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center}.bot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#285da7;font-size:25px;border:1px solid #69a0ec}
h1{font-size:17px;margin:0}.online{font-size:12px;color:#66e0ad;margin-top:3px}.demo{margin-left:auto;background:#193a63;color:#bcd3ef;border:1px solid #315886;border-radius:20px;padding:6px 9px;font-size:11px}
.setup{padding:15px 16px;border-bottom:1px solid var(--line);background:#0e223c}.setup-title{font-size:12px;color:#b7cbe2;margin-bottom:9px}.industries{display:grid;grid-template-columns:1fr 1fr;gap:7px}.industries button{border:1px solid #345a87;border-radius:10px;background:#183552;color:#e7f1ff;padding:9px 6px;font-size:12px}.industries button.active{background:var(--yellow);color:#10233c;border-color:var(--yellow);font-weight:800}
.store-row{display:flex;gap:7px;margin-top:9px}.store-row input{flex:1;min-width:0;border:1px solid #385d8b;border-radius:10px;background:#f4f8ff;color:#142943;padding:10px 11px}.store-row button{border:0;border-radius:10px;background:#2c69c6;color:white;padding:0 14px;font-weight:800}
#chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:11px}.msg{max-width:88%;border-radius:16px;padding:11px 13px;white-space:pre-wrap;line-height:1.5;font-size:14px}.botmsg{align-self:flex-start;background:#1c3859;border-bottom-left-radius:5px}.user{align-self:flex-end;background:var(--yellow);color:#132944;border-bottom-right-radius:5px;font-weight:600}
.quick{display:flex;gap:7px;overflow:auto;padding:0 14px 9px}.quick button{flex:none;border:1px solid #365c88;background:#173653;color:#eaf3ff;border-radius:18px;padding:7px 10px;font-size:11px}.composer{border-top:1px solid var(--line);padding:10px 12px 12px;background:#0a1d34}.bar{display:flex;gap:8px;background:#173654;border:1px solid #355d8d;border-radius:26px;padding:5px 5px 5px 13px}.bar input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:white}.bar button{width:42px;height:42px;border:0;border-radius:50%;background:var(--yellow);font-size:18px;font-weight:900;color:#10243d}.cta{padding:11px 12px 0;text-align:center}.cta a{display:block;width:100%;padding:12px 14px;border-radius:12px;background:var(--yellow);color:#10243e;font-size:14px;font-weight:900;text-decoration:none;box-shadow:0 8px 22px #0004}.notice{text-align:center;color:#7896b9;font-size:10px;padding:8px 12px 4px}
@media(max-width:420px){.setup{padding:12px}.industries button{font-size:11px}.msg{max-width:92%}}
body.wide-demo{display:block}.wide-demo .app{max-width:none;min-height:100dvh}.wide-demo #chat{padding:22px 28px}.wide-demo .msg{max-width:min(75%,900px)}.wide-demo .quick,.wide-demo .composer{padding-left:28px;padding-right:28px}@media(max-width:600px){.wide-demo #chat{padding:16px}.wide-demo .msg{max-width:92%}.wide-demo .quick,.wide-demo .composer{padding-left:12px;padding-right:12px}}

/* Public operator-style demo: no owner credentials, tenant requests or settings. */
body.operator-demo{display:block;height:100dvh;overflow:hidden;background:#09172a}
.operator-demo .app{height:100dvh;min-height:0;width:100%;max-width:none;background:radial-gradient(circle at 85% 20%,#153259,#08182e 65%)}
.operator-demo header{min-height:72px;background:#112845;padding:12px 22px}
.operator-demo .setup{display:none!important}
.operator-demo #chat{min-height:0;flex:1;padding:24px 28px;gap:17px}
.operator-demo .msg{max-width:min(66%,720px);font-size:14px;background:#223c60}
.operator-demo .msg.user{background:#ffbe12;color:#10223a}
.operator-demo .quick{padding:10px 22px;gap:9px;background:#0c2039}
.operator-demo .composer{padding:10px 22px 14px;background:#0c2039}
.operator-demo .bar{max-width:none;min-height:54px;background:#173654}
.operator-demo .cta a{font-size:13px;padding:10px}
.operator-demo .demo{font-weight:700}
@media(max-width:600px){.operator-demo header{padding:12px}.operator-demo #chat{padding:15px}.operator-demo .msg{max-width:91%}.operator-demo .quick{padding:8px}.operator-demo .composer{padding:10px}.operator-demo .cta a{font-size:12px}}

.app{height:100dvh!important;min-height:0!important}#chat{min-height:0}header{flex-shrink:0}.composer,.quick{flex-shrink:0}
body.operator-demo{background:#09172a}.operator-demo .app{max-width:520px;margin:auto}
@media(min-width:700px){body.operator-demo .app{height:calc(100dvh - 32px)!important;margin:16px auto;border:1px solid #355b87;border-radius:26px;overflow:hidden}}
</style>
</head>
<body class="operator-demo">
<div class="app">
<header><div class="bot">🤖</div><div><h1>Encore 비서</h1><div class="online">● 아라 · 샘플 매장 체험</div></div><div class="demo">PUBLIC DEMO</div></header>
<section class="setup" id="setup">
  <div class="setup-title">어떤 매장을 운영하세요? 업종에 맞춰 아라가 답해드려요.</div>
  <div class="industries">
    <button data-v="restaurant">🍽 식당 · 카페</button>
    <button data-v="beauty">✂️ 미용 · 네일 · 스파</button>
    <button data-v="retail">🛍 리테일 · 마켓</button>
    <button data-v="service">🧰 서비스업</button>
  </div>
  <div class="store-row"><input id="storeName" placeholder="매장 이름 (선택)"><button id="startBtn">체험 시작</button></div>
</section>
<div id="chat"></div>
<div class="quick" id="quick"></div>
<div class="composer">
 <div class="bar"><input id="input" placeholder="예: 주말 세일 문자 만들어줘" maxlength="1200"><button id="send">↑</button></div>
 <div class="cta"><a id="cta" target="_top" href="https://demo.encoremarketingsystem.com/apply">내 매장으로 시작하기 →</a></div>
 <div class="notice">데모는 실제 고객 데이터 조회·문자 발송·게시·예약을 하지 않습니다.</div>
</div>
</div>
<script>
const params=new URLSearchParams(location.search);
if(params.get("layout")==="wide")document.body.classList.add("wide-demo");
if(params.get("layout")==="operator")document.body.classList.add("operator-demo");
let industry=params.get("industry")||"other";
let source=params.get("source")||"website";
let storeName=params.get("store")||"";
let sessionId=sessionStorage.getItem("encore_demo_session")||"";
const setup=document.getElementById("setup"), chat=document.getElementById("chat"), input=document.getElementById("input");
document.getElementById("storeName").value=storeName;
const labels={restaurant:"식당/카페",beauty:"미용/네일/스파",retail:"리테일/마켓",service:"서비스업",other:"기타"};
const quicks={
 restaurant:["주말 프로모션 문구 만들어줘","리뷰를 더 받으려면?","재방문 고객을 늘리고 싶어"],
 beauty:["예약 리마인드 문구 만들어줘","리뷰 요청 문구 만들어줘","한 달 뒤 재방문 문자"],
 retail:["20% 세일 문자 만들어줘","단골 고객을 늘리고 싶어","Google 홍보글 예시 보여줘"],
 service:["신규 고객 홍보 문구","리뷰 요청 문구","기존 고객 재방문 아이디어"],
 other:["Encore로 뭘 할 수 있어?","홍보 문구 만들어줘","리뷰를 늘리고 싶어"]
};
function cleanDemoText(text){
 return String(text||"")
   .replace(/^#{1,6}\s*/gm,"")
   .replace(/\*\*(.*?)\*\*/g,"$1")
   .replace(/__(.*?)__/g,"$1")
   .replace(/^```.*$/gm,"")
   .replace(/```$/gm,"")
   .replace(/^s*[-*]s+/gm,"• ")
   .replace(/\n{3,}/g,"\n\n")
   .trim();
}
function add(kind,text){const d=document.createElement("div");d.className="msg "+(kind==="user"?"user":"botmsg");d.textContent=kind==="user"?text:cleanDemoText(text);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function renderQuick(){const q=document.getElementById("quick");q.innerHTML="";(quicks[industry]||quicks.other).forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{input.value=t;send()};q.appendChild(b);});}
function selectIndustry(v){industry=v;document.querySelectorAll(".industries button").forEach(b=>b.classList.toggle("active",b.dataset.v===v));}
document.querySelectorAll(".industries button").forEach(b=>b.onclick=()=>selectIndustry(b.dataset.v));
if(industry)selectIndustry(industry);
document.getElementById("startBtn").onclick=()=>{
 if(!industry)industry="other";
 storeName=document.getElementById("storeName").value.trim();
 setup.style.display="none";renderQuick();
 add("bot",(storeName?storeName+"을 ":"매장을 ")+labels[industry]+" 업종으로 보고 바로 도와드릴게요. 아래 추천 질문을 눌러보세요.");
 input.focus();
};
let sending=false;
let history=[]; renderQuick(); add("bot","어머~ 사장님! 저는 사장님 비서 아라예요. 무엇을 도와드릴까요?");
async function send(){
 const msg=input.value.trim();if(!msg||sending)return;
 if(setup.style.display!=="none"){if(!industry)industry="other";storeName=document.getElementById("storeName").value.trim();setup.style.display="none";renderQuick();}
 sending=true;document.getElementById("send").disabled=true;
 input.value="";add("user",msg);
 const reply=document.createElement("div");reply.className="msg botmsg";reply.textContent="아라가 생각 중…";chat.appendChild(reply);chat.scrollTop=chat.scrollHeight;
 let textSoFar="",done=false,incomplete=false;
 try{
  const response=await fetch("/ara-demo-api/chat/stream",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:msg,industry,store_name:storeName,source,session_id:sessionId||null,history})});
  if(!response.ok){let error=await response.json().catch(()=>({}));throw new Error(error.detail||"잠시 후 다시 시도해 주세요.");}
  if(!response.body)throw new Error("스트리밍을 지원하지 않는 브라우저입니다.");
  const reader=response.body.getReader(),decoder=new TextDecoder();let buffer="";
  const eventLine=line=>{
   if(!line.startsWith("data: "))return;
   let event;try{event=JSON.parse(line.slice(6));}catch(_){return;}
   if(event.type==="status"){reply.textContent="아라가 답변을 준비하고 있어요…";}
   else if(event.type==="chunk"){
    textSoFar+=event.text||"";
    reply.textContent=cleanDemoText(textSoFar);
    chat.scrollTop=chat.scrollHeight;
   }else if(event.type==="error"){
    incomplete=true;
   }else if(event.type==="done"){
    incomplete=incomplete||event.incomplete;
    done=true;sessionId=event.session_id;sessionStorage.setItem("encore_demo_session",sessionId);

   }
  };
  while(true){
   const {value,done:ended}=await reader.read();if(ended)break;
   buffer+=decoder.decode(value,{stream:true});let pos;
   while((pos=buffer.indexOf("\n"))!==-1){const line=buffer.slice(0,pos).trim();buffer=buffer.slice(pos+1);eventLine(line);}
  }
  if(buffer.trim())eventLine(buffer.trim());
  if(!done)throw new Error("응답이 끝나기 전에 연결이 끊어졌어요.");
  if(textSoFar&&!incomplete){history.push({role:"user",text:msg.slice(0,1200)},{role:"assistant",text:textSoFar.slice(0,1200)});history=history.slice(-8);}
  if(incomplete)reply.textContent=cleanDemoText(textSoFar)+"\n\n(답변이 중단됐어요. 다시 질문해 주세요.)";
  if(!textSoFar)reply.textContent="응답을 받지 못했어요. 다시 시도해 주세요.";
 }catch(e){reply.textContent=textSoFar?cleanDemoText(textSoFar)+"\n\n(연결이 중단됐어요.)":String(e.message||"잠시 연결이 원활하지 않아요.");}
 finally{sending=false;document.getElementById("send").disabled=false;input.focus();}
}
document.getElementById("send").onclick=send;input.onkeydown=e=>{if(e.key==="Enter")send();};
if(params.get("autostart")==="1"){if(!industry)industry="other";document.getElementById("startBtn").click();}
</script>
</body>
</html>
