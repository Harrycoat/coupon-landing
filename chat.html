      '<p>새 리뷰가 달렸다고 가정해볼게요. (예시)</p><div class="lrv">★☆☆☆☆ "Came in for a shirt and they didn\'t have my size. Wasted trip."</div>' +
      '<div class="lsms">We are sorry about the wasted trip. Please call us before you visit and we will check your size for you. Thank you for the feedback. - Sample Store</div>' +
      '<p class="lgloss">한국어 뜻: 헛걸음을 사과하고, 방문 전 전화하면 사이즈를 확인해준다는 안내예요. 낮은 별점 답글은 읽어보고 승인하세요.</p><div class="lbtns"><button type="button" data-demo="approve">승인하고 게시</button><button type="button" data-demo="edit">수정</button></div>' };
  }
  function postCard() {
    return { plain: '(구글 게시물 영어 초안 카드를 보여줌: Weekend sale at Sample Store! 20% off everything this Saturday and Sunday.)', html:
      '<p>구글 게시물 초안을 영어로 써봤어요. 사진은 사장님이 골라서 올려주세요.</p><div class="lsms">Weekend sale at Sample Store! 20% off everything this Saturday and Sunday. Stop by and say hello.</div>' +
      '<p class="lgloss">한국어 뜻: 이번 주말 토요일, 일요일 전 품목 20% 할인. 편하게 들러주세요. (사진은 직접 선택)</p><div class="lbtns"><button type="button" data-demo="approve">승인하고 게시</button><button type="button" data-demo="edit">수정</button></div>' };
  }
  function askCard() {
    return { plain: '(구글 리뷰 부탁 문자 영어 초안 카드를 보여줌: 동의한 모든 손님께 같은 문자)', html:
      '<p>리뷰 부탁 문자 초안이에요. 수신에 동의한 모든 손님께 똑같이 나가요.</p><div class="lsms">[Sample Store] Thank you for visiting! If you have a minute, we would appreciate a Google review: [review link]<br>Reply STOP to opt out.</div>' +
      '<p class="lgloss">한국어 뜻: 방문 감사 인사와 구글 리뷰 부탁이에요. 별점을 보고 고르지 않고, 리뷰 대가로 쿠폰을 주지 않아요. (링크는 가게 설정의 구글 리뷰 주소가 들어가요)</p><div class="lbtns"><button type="button" data-demo="approve">승인하고 발송</button><button type="button" data-demo="edit">수정</button></div>' };
  }
  function scripted(t) {
    if (/요금|가격|얼마|비용|플랜|월/.test(t)) return { text: '요금은 매장 한 곳 기준 월 요금이에요.\n· Starter $49: 포인트와 쿠폰 자동화, 이메일 알림\n· Growth $89: Starter 전체와 문자 알림, 월간 리포트, AI 비서 대화\n설치비는 $149(1회)이고, 매장이 3곳 이상이면 2번째 매장부터 15% 할인돼요. 자세한 조건은 상담에서 안내해드려요.' };
    if (/(리뷰|후기).*(부탁|요청)|(부탁|요청).*(리뷰|후기)/.test(t)) return askCard();
    if (/분석/.test(t) && /(리뷰|후기|평)/.test(t)) return { text: '(예시) 최근 리뷰 20건을 읽어봤어요.\n칭찬: 가격, 친절, 다양한 상품\n불만: 사이즈 부족, 계산 대기, 일부 제품 품질\n이번 주 할 일: ① 인기 사이즈 재고 확인 ② 낮은 별점 리뷰에 정중한 답글 ③ 계산대 대기 줄이기\n답글 초안을 만들어 드릴까요?' };
    if (/게시물|포스트|사진/.test(t)) return postCard();
    if (/예약/.test(t)) return { text: '예약 접수는 준비 중이에요. 예약 링크를 구글 프로필과 문자에 달아두고, 예약이 들어오면 한국어로 알려드리는 방식으로 만들고 있어요. 미용실이나 서비스업 매장에 특히 잘 맞아요. 관심 있으시면 아래에서 상담을 신청해주세요.' };
    if (/마케팅|아이디어|조언|손님.*(부르|늘)/.test(t)) return { text: '가게 업종과 영업시간을 알려주시면 맞춰서 드려요. 예를 들면 비 오는 주말에는 "영업 중입니다" 게시물과 실내 상품 소식을 올리거나, 한 달 안 온 단골께 안부 문자를 보내는 방법이 있어요. 해보시고 결과를 말씀해주시면 다음 제안에 반영해요.' };
    if (/리뷰|후기|답글/.test(t)) return reviewCard();
    if (/세일|할인|프로모션|문자/.test(t)) return smsCard();
    if (/단골|고객|안 온|휴면/.test(t)) return { text: '(예시) 60일 넘게 안 온 단골이 31명이에요. 그중 문자 수신에 동의한 분은 24명이라 이분들께만 재방문 문자를 보낼 수 있어요. 문자 초안을 만들어 드릴까요?' };
    if (/수익|매출|지출/.test(t)) return { text: '"오늘 수익 1240 지출 380"처럼 말하면 기록하고, 이번 달이 지난달보다 적은 이유 후보도 정리해드려요. 세금 신고용이 아니라 마케팅 판단용이에요.' };
    if (/상담|신청|연락|시작|써보/.test(t)) return { text: '좋아요! 아래 신청 칸으로 안내할게요. 매장 이름과 연락처만 남겨주세요.', go: true };
    if (/^\s*(안녕|하이|hi|hello)/i.test(t)) return { text: '안녕하세요! 저는 도우미예요. 세일 문자나 리뷰 답글을 직접 시켜보세요.' };
    return { text: '체험 화면이라 정해진 몇 가지만 알아들어요. 세일 문자, 리뷰 답글, 요금, 단골 관리를 물어보세요. 자유로운 대화는 상담 때 직접 보여드려요.' };
  }

  /* ----- AI 모드 ----- */
  function turns() {
    var out = [];
    msgs.slice(-10).forEach(function (m) {
      var role = m.role === 'me' ? 'user' : 'assistant', c = m.role === 'me' ? m.text : (m.plain || m.text);
      if (!c) return;
      if (out.length && out[out.length - 1].role === role) out[out.length - 1].content += '\n' + c; else out.push({ role: role, content: c });
    });
    while (out.length && out[0].role !== 'user') out.shift();
    return out;
  }
  function clean(t) { return String(t || '').replace(/\*\*/g, '').replace(/^#+\s*/gm, '').replace(/`/g, '').trim(); }
  async function askAI() {
    var t = turns(); if (!t.length) throw new Error('empty');
    if (CHAT_ENDPOINT) {
      var ctl = new AbortController(), to = setTimeout(function () { ctl.abort(); }, 30000);
      try {
        var r = await fetch(CHAT_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ sid: sid, messages: t }), signal: ctl.signal });
        var j = await r.json();
        if (j && j.ok && j.text) return clean(j.text);
        var e = new Error(j && j.error || 'fail'); e.code = j && j.error; throw e;
      } finally { clearTimeout(to); }
    }
    if (sampleFn) {
      var inp = [{ role: 'user', content: SYSTEM + '\n\n[대화 시작]' }].concat(t);
      var res = await sampleFn(inp, { cache: false, modelTier: 'quick' });
      return clean(res.text);
    }
    throw new Error('no-ai');
  }
  function aiAvailable() { return !!(CHAT_ENDPOINT || sampleFn) && aiFails < 3; }

  async function typeOut(reply) {
    if (!reply.text || reply.html || reduce) { addBot(reply); draw(); return; }
    var full = reply.text, m = { role: 'bot', text: '', html: '', plain: full, t: Date.now() };
    msgs.push(m);
    var step = Math.max(1, Math.ceil(full.length / 90));
    for (var i = 0; i < full.length; i += step) { m.text = full.slice(0, i + step); draw(); await wait(22); }
    m.text = full; draw();
  }
  async function handle(text) {
    text = String(text || '').trim(); if (!text || busy) return;
    if (userCount >= 20) { addMe(text); addBot({ text: '체험 대화를 충분히 해보셨어요. 더 보고 싶으시면 아래에서 상담을 신청해주세요. 매장에서 직접 보여드릴게요.' }); draw(); return; }
    busy = true; userCount++; addMe(text); input.value = ''; draw(true);
    var reply = null;
    try {
      if (aiAvailable()) { var tx = await askAI(); reply = { text: tx }; }
    } catch (e) {
      if (e && e.code === 'limit') reply = { text: '오늘 체험 횟수를 다 썼어요. 아래에서 상담을 신청해주시면 매장에서 직접 보여드릴게요.' };
      else { aiFails++; reply = null; }
    }
    if (!reply) { await wait(700); reply = scripted(text); }
    await typeOut(reply); busy = false;
    if (reply.go) setTimeout(function () { location.href = 'index.html#apply'; }, 1100);
  }

  var CHIPS = ['리뷰 분석해줘', '구글 게시물 써줘', '리뷰 부탁 문자', '영어 리뷰에 답글 써줘', '요금이 얼마예요?', '상담 신청할래요'];
  chipsEl.innerHTML = CHIPS.map(function (c) { return '<button type="button" data-q="' + esc(c) + '">' + esc(c) + '</button>'; }).join('');
  chipsEl.addEventListener('click', function (e) { var b = e.target.closest('[data-q]'); if (b) handle(b.getAttribute('data-q')); });
  form.addEventListener('submit', function (e) { e.preventDefault(); handle(input.value); });
  box.addEventListener('click', function (e) {
    var b = e.target.closest('[data-demo]'); if (!b) return;
    var k = b.getAttribute('data-demo');
    addBot({ text: k === 'approve' ? '체험 화면이라 실제로 발송되지는 않아요. 서비스를 쓰시면 이 버튼으로 동의한 고객에게만 문자가 나가요.' : '실제로는 "30%로 바꿔줘", "더 정중하게"처럼 말로 고칠 수 있어요. 한번 입력해보세요.' });
    draw();
  });

  /* 말로 입력하기 (브라우저의 음성 인식 기능을 써요. 지원하지 않으면 버튼이 숨겨져요) */
  (function () {
    var micBtn = $('lmic'), SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!micBtn) return;
    if (!SR) { micBtn.hidden = true; return; }
    var rec = null, listening = false, finalText = '', startedAt = 0;
    function setMic(on) { listening = on; micBtn.classList.toggle('on', on); micBtn.setAttribute('aria-pressed', on ? 'true' : 'false'); input.placeholder = on ? '듣고 있어요… 말씀하세요' : '비서에게 말해보세요'; }
    function tell(msg) { addBot({ text: msg }); draw(); }
    micBtn.addEventListener('click', function () {
      if (listening && rec) { rec.stop(); return; }
      if (busy) return;
      try {
        rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
        finalText = ''; startedAt = Date.now();
        rec.onstart = function () { setMic(true); };
        rec.onresult = function (e) {
          var interim = '';
          for (var i = e.resultIndex; i < e.results.length; i++) {
            var tr = e.results[i][0].transcript;
            if (e.results[i].isFinal) finalText = (finalText + ' ' + tr).trim(); else interim += tr;
          }
          input.value = (finalText + ' ' + interim).trim();
        };
        rec.onerror = function (e) {
          setMic(false);
          if (e.error === 'not-allowed' || e.error === 'service-not-allowed') tell('마이크 사용이 허용되지 않았어요. 주소창 왼쪽 자물쇠에서 마이크를 허용하거나, 글자로 입력해주세요.');
          else if (e.error === 'no-speech') tell('소리가 잘 안 들렸어요. 마이크 버튼을 다시 눌러서 말씀해주세요.');
          else if (e.error !== 'aborted') tell('음성 입력을 쓸 수 없어요. 글자로 입력해주세요.');
        };
        rec.onend = function () { setMic(false); var v = (input.value || '').trim(); if (v) handle(v); };
        rec.start();
      } catch (err) { setMic(false); tell('음성 입력을 시작하지 못했어요. 글자로 입력해주세요.'); }
    });
  })();

  /* 구글 Claude 화면에서 열었을 때만 쓰이는 미리보기용 AI (공개 사이트에서는 없어요) */
  try {
    if (!CHAT_ENDPOINT && window.claude && window.claude.use) {
      window.claude.use('sample').then(function (f) { if (f) { sampleFn = f; $('lnote').textContent = '미리보기: 진짜 AI와 대화 중이에요. 문자는 실제로 발송되지 않아요. 개인정보는 입력하지 마세요.'; } }, function () {});
    }
  } catch (e) {}
  if (CHAT_ENDPOINT) $('lnote').textContent = 'AI와 대화 중이에요. 문자는 실제로 발송되지 않아요. 개인정보나 고객 전화번호는 입력하지 마세요.';

  /* 첫 장면: 한 번만 자동으로 보여줘요 */
  (async function intro() {
    addBot({ text: '안녕하세요 사장님! 저는 도우미예요. 한국어로 시키시면 영어 문자와 답글을 써드려요.' }); draw();
    await wait(1400); if (userCount > 0) return;
    addMe('이번 주말 전 품목 20% 세일 문자 써줘'); draw(true);
    await wait(1300); if (userCount > 0) { draw(); return; }
    addBot(smsCard()); draw();
  })();
})();

</script>
<script>
/* 폰에서 키보드가 올라와도 입력창이 가려지지 않게 화면 높이를 맞춰요 */
(function () {
  var app = document.getElementById('app'), box = document.getElementById('lmsgs');
  function fit() {
    var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    app.style.setProperty('--app-h', h + 'px');
    box.scrollTop = box.scrollHeight;
  }
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', fit); window.visualViewport.addEventListener('scroll', fit); }
  window.addEventListener('orientationchange', fit);
  fit();
})();
</script>
</body>
