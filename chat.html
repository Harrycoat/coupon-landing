  function fillPost(pp, t) {

    if (pp.type === 'closed' && !pp.date) pp.date = pDate(t);
  }
  function postReply(t) {
    if (pendingPost) {
      var pp = pendingPost;
      if (pp.need === 'type') { var ty = pType(t); if (!ty) { pendingPost = null; return null; } pp = { type: ty }; fillPost(pp, t); return postNext(pp); }
      var before = JSON.stringify([pp.pct, pp.period, pp.date]); fillPost(pp, t);
      if (JSON.stringify([pp.pct, pp.period, pp.date]) === before) {
        if (t.length <= 12 && !/\?|얼마|뭐|어떻게/.test(t) && !pp.tries) { pp.tries = 1; return postNext(pp); }
        pendingPost = null; return null;
      }
      return postNext(pp);
    }
    if (!/게시물|포스트|구글\s*소식|가게\s*소식/.test(t)) return null;
    if (/올리는\s*(법|방법)|어떻게\s*올/.test(t)) return { text: '구글 지도 앱이나 business.google.com에서 내 가게를 열고 "업데이트 추가"를 눌러 사진과 글을 붙여넣으세요. [글 복사], [이미지 저장] 버튼으로 준비한 걸 쓰시면 돼요.' };
    var type = pType(t);
    if (!type) { pendingPost = { need: 'type' }; return askPostType(); }
    var q = { type: type }; fillPost(q, t); return postNext(q);
  }
  document.getElementById('lmsgs').addEventListener('click', function (e) {
    var tb = e.target.closest('[data-post-type]');
    if (tb) { handle(tb.getAttribute('data-post-type')); return; }
    var d = e.target.closest('[data-post="done"]');
    if (d) { postCount++; addBot({ text: '기록했어요. 이번에 올린 게시물이 ' + postCount + '개예요. (체험 화면이라 새로고침하면 사라져요)' }); draw(); }
  });

  async function handle(text) {
    text = String(text || '').trim(); if (!text || busy) return;
    if (userCount >= 20) { addMe(text); addBot({ text: '체험 대화를 충분히 해보셨어요. 더 보고 싶으시면 아래에서 상담을 신청해주세요. 매장에서 직접 보여드릴게요.' }); draw(); return; }
    busy = true; userCount++; addMe(text); input.value = ''; syncBar(); draw(true);
    var rr = pendingPost ? postReply(text) : (remindReply(text) || postReply(text));
    if (rr) { await wait(700); await typeOut(rr); busy = false; return; }
    var reply = null;
    try {
      if (aiAvailable()) { var tx = await askAI(); reply = { text: tx }; }
    } catch (e) {
      if (e && e.code === 'limit') reply = { text: '오늘 체험 횟수를 다 썼어요. 아래에서 상담을 신청해주시면 매장에서 직접 보여드릴게요.' };
      else { aiFails++; reply = null; }
    }
    if (!reply) { await wait(700); reply = scripted(text); }
    await typeOut(reply); busy = false;
    if (reply.go) setTimeout(function () { location.href = 'index.html#apply'; }, 1100);
  }

  var CHIPS = ['세일 문자 써줘', '알림 만들기', '구글 게시물 써줘', '영어 리뷰에 답글 써줘', '리뷰 분석해줘', '리뷰 부탁 문자', '매출 요약', '내 알림 보기', '요금이 얼마예요?', '상담 신청할래요'];
  chipsEl.innerHTML = CHIPS.map(function (c) { return '<button type="button" data-q="' + esc(c) + '">' + esc(c) + '</button>'; }).join('');
  chipsEl.addEventListener('click', function (e) { var b = e.target.closest('[data-q]'); if (!b) return; var q = b.getAttribute('data-q'); if (q === '알림 만들기') q = '내일 아침 9시에 거래처 주문 알려줘'; handle(q); });
  form.addEventListener('submit', function (e) { e.preventDefault(); handle(input.value); });
  box.addEventListener('click', function (e) {
    var b = e.target.closest('[data-demo]'); if (!b) return;
    var k = b.getAttribute('data-demo');
    if (k === 'copy') {
      var card = b.closest('.lbub'), el = card && card.querySelector('.lsms'), txt = el ? (el.innerText || el.textContent) : '';
      var ok = function () { addBot({ text: '복사했어요. 문자 앱이나 구글에 붙여넣어 사용하세요.' }); draw(); };
      var fail = function () { addBot({ text: '복사하지 못했어요. 글자를 길게 눌러서 직접 복사해주세요.' }); draw(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fail); else fail();
      return;
    }
    addBot({ text: k === 'approve' ? '체험 화면이라 실제로 발송되지는 않아요. 서비스를 쓰시면 이 버튼으로 동의한 고객에게만 문자가 나가요.' : '실제로는 "30%로 바꿔줘", "더 정중하게"처럼 말로 고칠 수 있어요. 한번 입력해보세요.' });
    draw();
  });

  var sendBtn = form.querySelector('button[type="submit"]'), micEl0 = $('lmic');
  function syncBar() {
    var has = input.value.trim().length > 0, micOff = !micEl0 || micEl0.getAttribute('data-off') === '1', listening = !!(micEl0 && micEl0.classList.contains('on'));
    if (micEl0) micEl0.hidden = micOff || (has && !listening);
    var showSend = micOff || (has && !listening);
    sendBtn.classList.toggle('off', !showSend);
    sendBtn.tabIndex = showSend ? 0 : -1;
  }
  input.addEventListener('input', syncBar);
  box.addEventListener('scroll', updateDown);
  if (downBtn) downBtn.addEventListener('click', scrollDown);
  syncBar();

  /* 말로 입력하기 (브라우저의 음성 인식 기능을 써요. 지원하지 않으면 버튼이 숨겨져요) */
  (function () {
    var micBtn = $('lmic'), SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!micBtn) return;
    if (!SR) { micBtn.setAttribute('data-off', '1'); micBtn.hidden = true; syncBar(); return; }
    var rec = null, listening = false, finalText = '', startedAt = 0;
    function setMic(on) { listening = on; micBtn.classList.toggle('on', on); micBtn.setAttribute('aria-pressed', on ? 'true' : 'false'); input.placeholder = on ? '듣고 있어요… 말씀하세요' : '비서에게 말해보세요'; syncBar(); }
    function tell(msg) { addBot({ text: msg }); draw(); }
    micBtn.addEventListener('click', function () {
      if (listening && rec) { rec.stop(); return; }
      if (busy) return;
      try {
        rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
        finalText = ''; startedAt = Date.now();
        rec.onstart = function () { setMic(true); };
        rec.onresult = function (e) {
          var interim = '';
          for (var i = e.resultIndex; i < e.results.length; i++) {
            var tr = e.results[i][0].transcript;
            if (e.results[i].isFinal) finalText = (finalText + ' ' + tr).trim(); else interim += tr;
          }
          input.value = (finalText + ' ' + interim).trim(); syncBar();
        };
        rec.onerror = function (e) {
          setMic(false);
          if (e.error === 'not-allowed' || e.error === 'service-not-allowed') tell('마이크 사용이 허용되지 않았어요. 주소창 왼쪽 자물쇠에서 마이크를 허용하거나, 글자로 입력해주세요.');
          else if (e.error === 'no-speech') tell('소리가 잘 안 들렸어요. 마이크 버튼을 다시 눌러서 말씀해주세요.');
          else if (e.error !== 'aborted') tell('음성 입력을 쓸 수 없어요. 글자로 입력해주세요.');
        };
        rec.onend = function () { setMic(false); var v = (input.value || '').trim(); if (v) handle(v); };
        rec.start();
      } catch (err) { setMic(false); tell('음성 입력을 시작하지 못했어요. 글자로 입력해주세요.'); }
    });
  })();

  /* 구글 Claude 화면에서 열었을 때만 쓰이는 미리보기용 AI (공개 사이트에서는 없어요) */
  try {
    if (!CHAT_ENDPOINT && window.claude && window.claude.use) {
      window.claude.use('sample').then(function (f) { if (f) { sampleFn = f; $('lnote').textContent = '미리보기: 진짜 AI와 대화 중이에요. 문자는 실제로 발송되지 않아요. 개인정보는 입력하지 마세요.'; } }, function () {});
    }
  } catch (e) {}
  if (CHAT_ENDPOINT) $('lnote').textContent = 'AI와 대화 중이에요. 문자는 실제로 발송되지 않아요. 개인정보나 고객 전화번호는 입력하지 마세요.';

  /* 첫 장면: 한 번만 자동으로 보여줘요 */
  (async function intro() {
    addBot({ text: '안녕하세요 사장님! 저는 도우미예요. 한국어로 시키시면 영어 문자와 답글을 써드려요.' }); draw();
    await wait(1400); if (userCount > 0) return;
    addMe('이번 주말 전 품목 20% 세일 문자 써줘'); draw(true);
    await wait(1300); if (userCount > 0) { draw(); return; }
    addBot(smsCard()); draw();
  })();
})();

</script>
<script>
/* 폰에서 키보드가 올라와도 입력창이 가려지지 않게 화면 높이를 맞춰요 */
(function () {
  var app = document.getElementById('app'), box = document.getElementById('lmsgs');
  function fit() {
    var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    app.style.setProperty('--app-h', h + 'px');
    box.scrollTop = box.scrollHeight;
  }
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', fit); window.visualViewport.addEventListener('scroll', fit); }
  window.addEventListener('orientationchange', fit);
  fit();
})();
</script>
